<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>getfit – MZ &amp; Gen Z 스타일 파트너</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="top-nav">
        <div class="logo">getfit</div>
        <button class="nav-btn" id="theme-toggle" aria-label="테마 전환">
          🌙
        </button>
      </nav>
      <div class="hero__content">
        <h1>MZ &amp; Gen Z를 위한 패션 큐레이션 플랫폼</h1>
        <p>
          최신 스트릿 감성부터 Y2K, 미니멀 코어까지. getfit은 당신의 하루와
          기분을 읽고, 지금 가장 뜨거운 아이템을 추천합니다.
        </p>
        <form class="style-form" id="style-form">
          <label class="style-form__label" for="mood-select">오늘의 무드</label>
          <select id="mood-select" name="mood">
            <option value="street">스트릿 &amp; 힙</option>
            <option value="y2k">Y2K &amp; 레트로</option>
            <option value="minimal">미니멀 &amp; 모던</option>
            <option value="quiet">조용한 사치</option>
            <option value="athleisure">애슬레저 &amp; 웰니스</option>
          </select>
          <label class="style-form__label" for="occasion-select">오늘의 일정</label>
          <select id="occasion-select" name="occasion">
            <option value="campus">캠퍼스 라이프</option>
            <option value="date">데이트</option>
            <option value="office">오피스/인턴</option>
            <option value="party">파티 &amp; 페스티벌</option>
            <option value="travel">여행 &amp; 위캔드</option>
          </select>
          <button type="submit" class="cta">추천 받기</button>
        </form>
      </div>
    </header>

    <main>
      <section class="trend" aria-live="polite">
        <h2><span>오늘의 픽</span> <strong id="trend-title">스트릿 무드 캠퍼스룩</strong></h2>
        <p id="trend-description">
          오버핏 데님 재킷에 그래픽 티셔츠, 볼드한 스니커즈로 완성하는
          하이틴 무드. 볼캡과 실버 액세서리로 마무리하세요.
        </p>
        <div class="cards" id="trend-cards"></div>
      </section>

      <section class="drops">
        <h2>핫한 드롭 캘린더</h2>
        <div class="drops__list" id="drop-list"></div>
      </section>

      <section class="looks">
        <h2>스타일 룩북</h2>
        <div class="looks__grid" id="lookbook"></div>
      </section>
    </main>

    <footer class="footer">
      <div>
        <h3>getfit newsletter</h3>
        <p>주간 드롭 소식과 스타일링 팁을 받고 싶다면 이메일을 등록하세요.</p>
      </div>
      <form class="newsletter">
        <label class="sr-only" for="email">이메일</label>
        <input type="email" id="email" placeholder="you@example.com" required />
        <button type="submit">구독하기</button>
      </form>
    </footer>

    <template id="card-template">
      <article class="card">
        <div class="card__tag"></div>
        <h3 class="card__title"></h3>
        <p class="card__brand"></p>
        <div class="card__price"></div>
      </article>
    </template>

    <template id="drop-template">
      <article class="drop">
        <div class="drop__time"></div>
        <h3 class="drop__title"></h3>
        <p class="drop__meta"></p>
      </article>
    </template>

    <template id="look-template">
      <article class="look">
        <div class="look__image"></div>
        <h3 class="look__title"></h3>
        <p class="look__caption"></p>
      </article>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
